[package]
name = "bevy-template"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
description = "A Bevy game template with a small 2D platformer starter"
publish = false

[dependencies]
bevy = { version = "0.20.1", default-features = false, features = [
    "2d",
    "audio",
    "ui",
] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
